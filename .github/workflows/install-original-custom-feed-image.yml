name: Install original custom feed diagram

on:
  push:
    branches: [main]
    paths:
      - ".tmp-custom-feed-image-jpg/READY"

permissions:
  contents: write

jobs:
  install-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct the original image file
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p static/images/omnissiahs-sieve-ai
          cat .tmp-custom-feed-image-jpg/[0-9][0-9].b64 | base64 --decode > static/images/omnissiahs-sieve-ai/high-end-custom-feed-concept.jpg
          test "$(sha256sum static/images/omnissiahs-sieve-ai/high-end-custom-feed-concept.jpg | awk '{print $1}')" = "0f6afea554630f309f7890ee85958bc867e4284caf764d70f8e314fe4b6e92b4"

      - name: Replace the mistaken redraw
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path("content/projects/omnissiahs-sieve-ai/high-end-custom-feed-idea.md")
          s = p.read_text(encoding="utf-8")
          s = s.replace(
              "![高端定制信息流 AI 概念草图](/images/omnissiahs-sieve-ai/high-end-custom-feed-concept.svg)",
              "![高端定制信息流 AI 概念草图](/images/omnissiahs-sieve-ai/high-end-custom-feed-concept.jpg)"
          )
          s = s.replace(
              "![高端定制信息流 AI 概念草图](/images/omnissiahs-sieve-ai/high-end-custom-feed-concept.png)",
              "![高端定制信息流 AI 概念草图](/images/omnissiahs-sieve-ai/high-end-custom-feed-concept.jpg)"
          )
          p.write_text(s, encoding="utf-8")
          PY
          rm -f static/images/omnissiahs-sieve-ai/high-end-custom-feed-concept.svg
          rm -f static/images/omnissiahs-sieve-ai/high-end-custom-feed-concept.png
          rm -rf .tmp-custom-feed-image .tmp-custom-feed-image-png .tmp-custom-feed-image-jpg
          rm -f .github/workflows/install-original-custom-feed-image.yml

      - name: Commit exact copied image
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Replace redrawn diagram with copied original image [skip ci]"
          git push origin main
