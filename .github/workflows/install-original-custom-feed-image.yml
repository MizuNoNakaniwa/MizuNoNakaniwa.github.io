name: Install original custom feed diagram

on:
  push:
    branches: [main]
    paths:
      - ".tmp-custom-feed-image-png/READY"

permissions:
  contents: write

jobs:
  install-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct exact PNG
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p static/images/omnissiahs-sieve-ai
          cat .tmp-custom-feed-image-png/[0-9][0-9].b64 | base64 --decode > static/images/omnissiahs-sieve-ai/high-end-custom-feed-concept.png
          test "$(sha256sum static/images/omnissiahs-sieve-ai/high-end-custom-feed-concept.png | awk '{print $1}')" = "e9681e438e02d88a0cdb6809bc3c074ea960c5628741231ef2c7f00a7203ca7e"

      - name: Point article to original PNG and clean temporary files
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path("content/projects/omnissiahs-sieve-ai/high-end-custom-feed-idea.md")
          s = p.read_text(encoding="utf-8")
          s = s.replace(
              "![高端定制信息流 AI 概念草图](/images/omnissiahs-sieve-ai/high-end-custom-feed-concept.svg)",
              "![高端定制信息流 AI 概念草图](/images/omnissiahs-sieve-ai/high-end-custom-feed-concept.png)"
          )
          p.write_text(s, encoding="utf-8")
          PY
          rm -f static/images/omnissiahs-sieve-ai/high-end-custom-feed-concept.svg
          rm -rf .tmp-custom-feed-image .tmp-custom-feed-image-png
          rm -f .github/workflows/install-original-custom-feed-image.yml

      - name: Commit exact image
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Replace redrawn diagram with exact original PNG [skip ci]"
          git push origin main
