name: Sync Steam reviews

on:
  workflow_dispatch:
  schedule:
    - cron: "23 */6 * * *"
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/steam-sync.yml"
      - "scripts/steam_sync.py"
      - "requirements-steam-sync.txt"

permissions:
  contents: write

concurrency:
  group: steam-review-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements-steam-sync.txt

      - name: Install sync dependencies
        run: pip install -r requirements-steam-sync.txt

      - name: Fetch and build Steam mirror
        run: python scripts/steam_sync.py

      - name: Safety check changed paths
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          bad=0
          while IFS= read -r line; do
            file="${line:3}"
            case "$file" in
              data/steam-sync.json|content/posts/game-reviews-and-research/steam-*.md)
                ;;
              *)
                echo "::error::Steam sync attempted to change forbidden path: $file"
                bad=1
                ;;
            esac
          done < <(git status --porcelain)
          test "$bad" -eq 0

      - name: Commit sync changes
        shell: bash
        run: |
          set -euo pipefail
          git add data/steam-sync.json content/posts/game-reviews-and-research/
          if git diff --cached --quiet; then
            echo "No Steam changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Sync Steam reviews"
          git push
