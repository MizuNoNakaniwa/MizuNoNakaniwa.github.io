{{/* 全站导航行为层：菜单内容只由 layouts/partials/menu.html 生成 */}}
<script>
(function () {
  function closeAllDropdowns(except) {
    document.querySelectorAll('.menu-item-dropdown.is-open').forEach(function (item) {
      if (item === except) return;
      item.classList.remove('is-open');
      const toggle = item.querySelector(':scope > .menu-dropdown-toggle');
      if (toggle) toggle.setAttribute('aria-expanded', 'false');
    });
  }

  function ensureSheetMusicLink() {
    const blogSubmenu = document.getElementById('blog-submenu');
    if (!blogSubmenu) return;
    if (blogSubmenu.querySelector('a[href*="/posts/my-sheet-music/"]')) return;

    const generalResearchLink = blogSubmenu.querySelector('a[href*="/posts/general-research/"]');
    if (!generalResearchLink) return;

    const item = document.createElement('li');
    const link = document.createElement('a');
    link.href = '/posts/my-sheet-music/';

    const en = document.createElement('span');
    en.className = 'submenu-en';
    en.textContent = 'My Sheet Music';

    const zh = document.createElement('span');
    zh.className = 'submenu-zh';
    zh.textContent = '我的琴谱';

    link.appendChild(en);
    link.appendChild(zh);
    item.appendChild(link);
    generalResearchLink.closest('li').insertAdjacentElement('afterend', item);
  }

  function bindDropdowns() {
    document.querySelectorAll('.menu-item-dropdown').forEach(function (item) {
      const toggle = item.querySelector(':scope > .menu-dropdown-toggle');
      const submenu = item.querySelector(':scope > .submenu');
      if (!toggle || !submenu || toggle.dataset.dropdownBound === '1') return;

      toggle.dataset.dropdownBound = '1';
      toggle.addEventListener('click', function (event) {
        event.preventDefault();
        event.stopPropagation();

        const willOpen = !item.classList.contains('is-open');
        closeAllDropdowns(item);
        item.classList.toggle('is-open', willOpen);
        toggle.setAttribute('aria-expanded', willOpen ? 'true' : 'false');
      });

      submenu.addEventListener('click', function (event) {
        event.stopPropagation();
      });
    });
  }

  document.addEventListener('DOMContentLoaded', function () {
    ensureSheetMusicLink();
    bindDropdowns();
  });
  window.addEventListener('pageshow', function () {
    ensureSheetMusicLink();
    bindDropdowns();
  });

  document.addEventListener('click', function (event) {
    if (!event.target.closest('.menu-item-dropdown')) closeAllDropdowns(null);
  });

  document.addEventListener('keydown', function (event) {
    if (event.key === 'Escape') closeAllDropdowns(null);
  });
})();
</script>
