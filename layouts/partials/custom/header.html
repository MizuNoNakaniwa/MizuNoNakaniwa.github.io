{{/* 全站导航行为层：菜单内容只由 layouts/partials/menu.html 生成 */}}
<script>
(function () {
  function closeAllDropdowns(except) {
    document.querySelectorAll('.menu-item-dropdown.is-open').forEach(function (item) {
      if (item === except) return;
      item.classList.remove('is-open');
      const toggle = item.querySelector(':scope > .menu-dropdown-toggle');
      if (toggle) toggle.setAttribute('aria-expanded', 'false');
    });
  }

  function bindDropdowns() {
    document.querySelectorAll('.menu-item-dropdown').forEach(function (item) {
      const toggle = item.querySelector(':scope > .menu-dropdown-toggle');
      const submenu = item.querySelector(':scope > .submenu');
      if (!toggle || !submenu || toggle.dataset.dropdownBound === '1') return;

      toggle.dataset.dropdownBound = '1';
      toggle.addEventListener('click', function (event) {
        event.preventDefault();
        event.stopPropagation();

        const willOpen = !item.classList.contains('is-open');
        closeAllDropdowns(item);
        item.classList.toggle('is-open', willOpen);
        toggle.setAttribute('aria-expanded', willOpen ? 'true' : 'false');
      });

      submenu.addEventListener('click', function (event) {
        event.stopPropagation();
      });
    });
  }

  document.addEventListener('DOMContentLoaded', bindDropdowns);
  window.addEventListener('pageshow', bindDropdowns);

  document.addEventListener('click', function (event) {
    if (!event.target.closest('.menu-item-dropdown')) closeAllDropdowns(null);
  });

  document.addEventListener('keydown', function (event) {
    if (event.key === 'Escape') closeAllDropdowns(null);
  });
})();
</script>
