{{/* 全站导航自愈层：确保 Projects 下拉菜单在每个页面保持一致 */}}
<style>
.header,
.header-wrapper,
.header-inner,
.header .nav,
.header .nav .menu,
.menu-item-dropdown {
  overflow: visible !important;
}

.menu-item-dropdown .submenu {
  display: none !important;
  height: auto !important;
  max-height: none !important;
  overflow: visible !important;
  z-index: 9999 !important;
}

.menu-item-dropdown.is-open .submenu {
  display: block !important;
}
</style>

<script>
(function () {
  function desiredProjectsHTML() {
    return (
      '<li><a href="{{ `/projects/tzeentch-intel/` | relLangURL }}">' +
        '<span class="submenu-en">Tzeentch_Intel</span>' +
        '<span class="submenu-zh">奸奇智库</span>' +
      '</a></li>' +
      '<li><a href="{{ `/projects/tzeentchs-staff-ai/` | relLangURL }}">' +
        '<span class="submenu-en">Tzeentch`s Staff AI</span>' +
        '<span class="submenu-zh">奸奇之杖AI</span>' +
      '</a></li>' +
      '<li><a href="{{ `/projects/consigliere-ai/` | relLangURL }}">' +
        '<span class="submenu-en">Consigliere AI</span>' +
        '<span class="submenu-zh">军师 AI</span>' +
      '</a></li>' +
      '<li><a href="{{ `/projects/xx-xinxue/` | relLangURL }}">' +
        '<span class="submenu-en">Dao：XXism</span>' +
        '<span class="submenu-zh">道：XX心学</span>' +
      '</a></li>' +
      '<li><a href="{{ `/projects/game/` | relLangURL }}">' +
        '<span class="submenu-en">Game:</span>' +
        '<span class="submenu-zh">游戏：</span>' +
      '</a></li>'
    );
  }

  function ensureProjectsMenu() {
    document.querySelectorAll('.header .nav .menu').forEach(function (menu) {
      const items = Array.from(menu.querySelectorAll(':scope > .menu-item'));
      let projectsItem = items.find(function (item) {
        const label = item.querySelector('.menu-item-name');
        if (label && label.textContent.trim() === 'Projects 我的项目') return true;

        const link = item.querySelector(':scope > a[href]');
        if (!link) return false;
        try {
          const url = new URL(link.getAttribute('href'), window.location.href);
          return url.origin === window.location.origin &&
            url.pathname.replace(/\/+$/, '/') === '/projects/';
        } catch (_) {
          return false;
        }
      });

      if (!projectsItem) {
        projectsItem = document.createElement('li');
        projectsItem.className = 'menu-item menu-item-dropdown';
        const firstItem = menu.querySelector(':scope > .menu-item');
        if (firstItem && firstItem.nextSibling) {
          menu.insertBefore(projectsItem, firstItem.nextSibling);
        } else {
          menu.appendChild(projectsItem);
        }
      }

      projectsItem.classList.add('menu-item-dropdown');

      let toggle = projectsItem.querySelector(':scope > .menu-dropdown-toggle');
      const oldLink = projectsItem.querySelector(':scope > a');

      if (!toggle) {
        toggle = document.createElement('button');
        toggle.className = 'menu-dropdown-toggle';
        toggle.type = 'button';
        toggle.setAttribute('aria-expanded', 'false');
        toggle.setAttribute('aria-controls', 'projects-submenu');
        toggle.innerHTML =
          '<span class="menu-item-name">Projects 我的项目</span>' +
          '<span class="dropdown-arrow" aria-hidden="true">▾</span>';

        if (oldLink) oldLink.replaceWith(toggle);
        else projectsItem.insertBefore(toggle, projectsItem.firstChild);
      } else {
        toggle.setAttribute('aria-controls', 'projects-submenu');
        const label = toggle.querySelector('.menu-item-name');
        if (label) label.textContent = 'Projects 我的项目';
      }

      let submenu = projectsItem.querySelector(':scope > .submenu');
      if (!submenu) {
        submenu = document.createElement('ul');
        submenu.className = 'submenu';
        projectsItem.appendChild(submenu);
      }
      submenu.id = 'projects-submenu';

      const hasGame = !!submenu.querySelector('a[href*="/projects/game/"]');
      const xxLink = submenu.querySelector('a[href*="/projects/xx-xinxue/"]');
      const hasCorrectXX =
        !!xxLink &&
        !!xxLink.querySelector('.submenu-en') &&
        xxLink.querySelector('.submenu-en').textContent.trim() === 'Dao：XXism' &&
        !!xxLink.querySelector('.submenu-zh') &&
        xxLink.querySelector('.submenu-zh').textContent.trim() === '道：XX心学';

      const intelLink = submenu.querySelector('a[href*="/projects/tzeentch-intel/"]');
      const hasCorrectIntel =
        !!intelLink &&
        !!intelLink.querySelector('.submenu-en') &&
        intelLink.querySelector('.submenu-en').textContent.trim() === 'Tzeentch_Intel' &&
        !!intelLink.querySelector('.submenu-zh') &&
        intelLink.querySelector('.submenu-zh').textContent.trim() === '奸奇智库';

      const staffLink = submenu.querySelector('a[href*="/projects/tzeentchs-staff-ai/"]');
      const hasCorrectStaff =
        !!staffLink &&
        !!staffLink.querySelector('.submenu-en') &&
        staffLink.querySelector('.submenu-en').textContent.trim() === 'Tzeentch`s Staff AI' &&
        !!staffLink.querySelector('.submenu-zh') &&
        staffLink.querySelector('.submenu-zh').textContent.trim() === '奸奇之杖AI';

      const consigliereLink = submenu.querySelector('a[href*="/projects/consigliere-ai/"]');
      const hasCorrectConsigliere =
        !!consigliereLink &&
        !!consigliereLink.querySelector('.submenu-en') &&
        consigliereLink.querySelector('.submenu-en').textContent.trim() === 'Consigliere AI' &&
        !!consigliereLink.querySelector('.submenu-zh') &&
        consigliereLink.querySelector('.submenu-zh').textContent.trim() === '军师 AI';

      const projectHrefs = Array.from(submenu.querySelectorAll(':scope > li > a')).map(function (a) {
        try {
          return new URL(a.getAttribute('href'), window.location.href).pathname.replace(/\/+$/, '/');
        } catch (_) {
          return '';
        }
      });
      const hasCorrectOrder =
        projectHrefs.length === 5 &&
        projectHrefs[0].endsWith('/projects/tzeentch-intel/') &&
        projectHrefs[1].endsWith('/projects/tzeentchs-staff-ai/') &&
        projectHrefs[2].endsWith('/projects/consigliere-ai/') &&
        projectHrefs[3].endsWith('/projects/xx-xinxue/') &&
        projectHrefs[4].endsWith('/projects/game/');

      if (!hasGame || !hasCorrectXX || !hasCorrectIntel || !hasCorrectStaff || !hasCorrectConsigliere || !hasCorrectOrder) {
        submenu.innerHTML = desiredProjectsHTML();
      }

    });
  }

  function closeAllDropdowns(except) {
    document.querySelectorAll('.menu-item-dropdown.is-open').forEach(function (item) {
      if (item === except) return;
      item.classList.remove('is-open');
      const toggle = item.querySelector(':scope > .menu-dropdown-toggle');
      if (toggle) toggle.setAttribute('aria-expanded', 'false');
    });
  }

  function bindAllDropdowns() {
    document.querySelectorAll('.menu-item-dropdown').forEach(function (item) {
      const toggle = item.querySelector(':scope > .menu-dropdown-toggle');
      const submenu = item.querySelector(':scope > .submenu');
      if (!toggle || !submenu || toggle.dataset.dropdownBound === '1') return;

      toggle.dataset.dropdownBound = '1';
      toggle.addEventListener('click', function (event) {
        event.preventDefault();
        event.stopPropagation();

        const willOpen = !item.classList.contains('is-open');
        closeAllDropdowns(item);
        item.classList.toggle('is-open', willOpen);
        toggle.setAttribute('aria-expanded', willOpen ? 'true' : 'false');
      });

      submenu.addEventListener('click', function (event) {
        event.stopPropagation();
      });
    });
  }

  function repairNavigation() {
    ensureProjectsMenu();
    bindAllDropdowns();
  }

  document.addEventListener('DOMContentLoaded', repairNavigation);
  window.addEventListener('pageshow', repairNavigation);

  let scheduled = false;
  const observer = new MutationObserver(function (mutations) {
    const touchesHeader = mutations.some(function (mutation) {
      const target = mutation.target.nodeType === 1 ? mutation.target : mutation.target.parentElement;
      return target && (target.closest('.header') || target.querySelector?.('.header'));
    });
    if (!touchesHeader || scheduled) return;

    scheduled = true;
    requestAnimationFrame(function () {
      scheduled = false;
      repairNavigation();
    });
  });

  observer.observe(document.documentElement, { childList: true, subtree: true });

  document.addEventListener('click', function (event) {
    if (!event.target.closest('.menu-item-dropdown')) closeAllDropdowns(null);
  });

  document.addEventListener('keydown', function (event) {
    if (event.key === 'Escape') closeAllDropdowns(null);
  });
})();
</script>
