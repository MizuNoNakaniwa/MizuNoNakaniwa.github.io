<style>
/* Blog dropdown: smooth slide-down animation */
.menu-item-dropdown {
  position: relative !important;
}

.menu-dropdown-toggle {
  appearance: none;
  -webkit-appearance: none;
  border: 0;
  background: transparent;
  color: #fff;
  font: inherit;
  line-height: inherit;
  padding: 0;
  margin: 0;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 0.35em;
}

.menu-dropdown-toggle .dropdown-arrow {
  display: inline-block;
  font-size: 0.72em;
  transform-origin: 50% 50%;
  transition: transform 220ms ease;
}

.menu-item-dropdown.is-open .dropdown-arrow {
  transform: rotate(180deg);
}

.header .nav .menu-item-dropdown .submenu {
  display: block !important;
  position: absolute !important;
  top: calc(100% + 0.9em) !important;
  left: 50% !important;
  right: auto !important;
  min-width: 0;
  width: max-content;
  max-width: min(34em, calc(100vw - 2rem));
  margin: 0 !important;
  padding: 0.45em 0 !important;
  list-style: none;
  background: #000;
  border: 1px solid #333;
  box-shadow: 0 10px 28px rgba(0,0,0,.28);
  z-index: 1000;

  opacity: 0;
  visibility: hidden;
  pointer-events: none;
  transform: translate(-50%, -12px);
  transition:
    opacity 180ms ease,
    transform 240ms cubic-bezier(.2,.8,.2,1),
    visibility 0s linear 240ms;
}

.header .nav .menu-item-dropdown.is-open .submenu {
  opacity: 1;
  visibility: visible;
  pointer-events: auto;
  transform: translate(-50%, 0);
  transition:
    opacity 180ms ease,
    transform 240ms cubic-bezier(.2,.8,.2,1),
    visibility 0s;
}

.header .nav .menu-item-dropdown .submenu li {
  margin: 0 !important;
  padding: 0 !important;
}

.header .nav .menu-item-dropdown .submenu a {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0.12em;
  padding: 0.68em 1.25em !important;
  color: #fff !important;
  text-decoration: none !important;
  text-align: center;
  line-height: 1.35;
}

.header .nav .menu-item-dropdown .submenu .submenu-en,
.header .nav .menu-item-dropdown .submenu .submenu-zh {
  display: block;
  white-space: nowrap;
}

.header .nav .menu-item-dropdown .submenu .submenu-zh {
  font-size: 0.96em;
}

.header .nav .menu-item-dropdown .submenu a:hover,
.header .nav .menu-item-dropdown .submenu a:focus {
  background: #222;
  color: #fff !important;
}

/* Keep bilingual Blog section titles on separate lines. */
.list-title {
  white-space: pre-line;
}

/* List year: traditional numerals left, English year right */
.list-year-bilingual {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  width: 100%;
}

.list-year-bilingual .list-year-en {
  margin-left: 1.5em;
  text-align: right;
  white-space: nowrap;
}

@media (max-width: 600px) {
  .header .nav .menu-item-dropdown .submenu {
    top: calc(100% + 0.75em) !important;
    max-width: calc(100vw - 1.2rem);
    font-size: 0.82em;
  }

  .header .nav .menu-item-dropdown .submenu a {
    gap: 0.05em;
    line-height: 1.2;
    padding: 0.58em 0.85em !important;
  }

  .header .nav .menu-item-dropdown .submenu .submenu-en,
  .header .nav .menu-item-dropdown .submenu .submenu-zh {
    white-space: normal;
  }

  .header .nav .menu-item-dropdown .submenu .submenu-zh {
    font-size: 0.92em;
  }
}
</style>


<!-- Global Projects menu synchronizer -->
<script>
(function () {
  const projectsHTML =
    '<li><a href="/projects/xx-xinxue/"><span class="submenu-en">Dao：XXism</span><span class="submenu-zh">道：XX心学</span></a></li>' +
    '<li><a href="/projects/tzeentch-intel/"><span class="submenu-en">Tzeentch Investment &amp; Intelligence</span><span class="submenu-zh">奸奇投资 &amp; 智库</span></a></li>' +
    '<li><a href="/projects/tzeentchs-staff-ai/"><span class="submenu-en">Tzeentch\`s Staff AI</span><span class="submenu-zh">奸奇之杖 AI</span></a></li>' +
    '<li><a href="/projects/consigliere-ai/"><span class="submenu-en">Consigliere AI</span><span class="submenu-zh">军师 AI</span></a></li>' +
    '<li><a href="/projects/claimtome-ai/"><span class="submenu-en">ClaimTome AI</span><span class="submenu-zh">合订本 AI</span></a></li>' +
    '<li><a href="/projects/ascensionism-project/"><span class="submenu-en">Ascensionism Project</span><span class="submenu-zh">飞扬主义计划</span></a></li>' +
    '<li><a href="/projects/aspergers-adhd-rescue-project/"><span class="submenu-en">Asperger’s &amp; ADHD Rescue Project</span><span class="submenu-zh">拯救阿斯伯格以及多动症计划</span></a></li>' +
    '<li><a href="/projects/game/"><span class="submenu-en">Game:</span><span class="submenu-zh">游戏：</span></a></li>' +
    '<li><a href="/projects/art-project-xxx/"><span class="submenu-en">Art Project: XXX</span><span class="submenu-zh">艺术项目：XXX</span></a></li>';

  function syncProjectsMenu() {
    document.querySelectorAll('.header .nav .menu').forEach(function (menu) {
      let item = Array.from(menu.children).find(function (li) {
        const label = li.querySelector(':scope > .menu-dropdown-toggle .menu-item-name, :scope > a .menu-item-name');
        return label && label.textContent.trim() === 'Projects 我的项目';
      });

      if (!item) {
        item = document.createElement('li');
        item.className = 'menu-item menu-item-dropdown';
        const about = menu.querySelector(':scope > .menu-item');
        if (about && about.nextSibling) menu.insertBefore(item, about.nextSibling);
        else menu.appendChild(item);
      }

      item.classList.add('menu-item-dropdown');

      let toggle = item.querySelector(':scope > .menu-dropdown-toggle');
      const directLink = item.querySelector(':scope > a');
      if (!toggle) {
        toggle = document.createElement('button');
        toggle.className = 'menu-dropdown-toggle';
        toggle.type = 'button';
        toggle.setAttribute('aria-expanded', 'false');
        toggle.setAttribute('aria-controls', 'projects-submenu');
        toggle.innerHTML = '<span class="menu-item-name">Projects 我的项目</span><span class="dropdown-arrow" aria-hidden="true">▾</span>';
        if (directLink) directLink.replaceWith(toggle);
        else item.insertBefore(toggle, item.firstChild);
      }

      let submenu = item.querySelector(':scope > .submenu');
      if (!submenu) {
        submenu = document.createElement('ul');
        submenu.className = 'submenu';
        item.appendChild(submenu);
      }
      submenu.id = 'projects-submenu';

      if (submenu.innerHTML !== projectsHTML) submenu.innerHTML = projectsHTML;
    });
  }

  document.addEventListener('DOMContentLoaded', syncProjectsMenu);
  window.addEventListener('pageshow', syncProjectsMenu);

  const observer = new MutationObserver(function () {
    window.requestAnimationFrame(syncProjectsMenu);
  });

  document.addEventListener('DOMContentLoaded', function () {
    observer.observe(document.body, { childList: true, subtree: true });
  });
})();
</script>
