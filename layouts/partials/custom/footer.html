{{/* 站点级: 页脚底图,仿 chinaheritage.net 最下方的长方形图片 */}}
{{ if .Site.Params.enableFooterImage }}
    <div class="footer-image">
        <img src="{{ .Site.Params.footerImage | relURL }}" alt="">
    </div>
{{ end }}

<style>
.header,
.header-wrapper,
.header-inner,
.header .nav,
.header .nav .menu,
.menu-item-dropdown {
  overflow: visible !important;
}

.menu-item-dropdown .submenu {
  display: none !important;
  height: auto !important;
  max-height: none !important;
  overflow: visible !important;
  z-index: 9999 !important;
}

.menu-item-dropdown.is-open .submenu {
  display: block !important;
}
</style>

<script>
document.addEventListener('DOMContentLoaded', function () {
  const menu = document.querySelector('.header .nav .menu');

  // Defense in depth: if any template/theme renders Projects as a normal link,
  // convert it back into the site-wide dropdown before the user can navigate.
  if (menu) {
    const items = Array.from(menu.querySelectorAll('.menu-item'));
    const projectsItem = items.find(function (item) {
      const label = item.querySelector('.menu-item-name');
      if (label && label.textContent.trim() === 'Projects 我的项目') return true;

      const link = item.querySelector('a[href]');
      if (!link) return false;
      try {
        const url = new URL(link.getAttribute('href'), window.location.href);
        return url.origin === window.location.origin && url.pathname.replace(/\/+$/, '/') === '/projects/';
      } catch (_) {
        return false;
      }
    });

    if (projectsItem) {
      projectsItem.classList.add('menu-item-dropdown');

      let toggle = projectsItem.querySelector('.menu-dropdown-toggle');
      const oldLink = projectsItem.querySelector(':scope > a');

      if (!toggle && oldLink) {
        toggle = document.createElement('button');
        toggle.className = 'menu-dropdown-toggle';
        toggle.type = 'button';
        toggle.setAttribute('aria-expanded', 'false');
        toggle.setAttribute('aria-controls', 'projects-submenu');
        toggle.innerHTML =
          '<span class="menu-item-name">Projects 我的项目</span>' +
          '<span class="dropdown-arrow" aria-hidden="true">▾</span>';
        oldLink.replaceWith(toggle);
      }

      let submenu = projectsItem.querySelector('.submenu');
      if (!submenu) {
        submenu = document.createElement('ul');
        submenu.className = 'submenu';
        submenu.id = 'projects-submenu';

        const li = document.createElement('li');
        const a = document.createElement('a');
        a.href = '{{ `/projects/game/` | relLangURL }}';
        a.innerHTML = '<span class="submenu-zh">游戏：</span>';
        li.appendChild(a);
        submenu.appendChild(li);
        projectsItem.appendChild(submenu);
      }
    }
  }

  const dropdowns = document.querySelectorAll('.menu-item-dropdown');
  if (!dropdowns.length) return;

  function closeAll(except) {
    dropdowns.forEach(function (dropdown) {
      if (dropdown === except) return;
      dropdown.classList.remove('is-open');
      const toggle = dropdown.querySelector('.menu-dropdown-toggle');
      if (toggle) toggle.setAttribute('aria-expanded', 'false');
    });
  }

  dropdowns.forEach(function (dropdown) {
    const toggle = dropdown.querySelector('.menu-dropdown-toggle');
    const submenu = dropdown.querySelector('.submenu');
    if (!toggle || !submenu) return;

    toggle.addEventListener('click', function (event) {
      event.preventDefault();
      event.stopPropagation();
      const willOpen = !dropdown.classList.contains('is-open');
      closeAll(dropdown);
      dropdown.classList.toggle('is-open', willOpen);
      toggle.setAttribute('aria-expanded', willOpen ? 'true' : 'false');
    });

    submenu.addEventListener('click', function (event) {
      event.stopPropagation();
    });
  });

  // Final guard: a Projects navigation link in the top menu is never allowed
  // to send the browser to /projects/.
  document.addEventListener('click', function (event) {
    const anchor = event.target.closest('.header .nav a[href]');
    if (!anchor) return;

    let url;
    try {
      url = new URL(anchor.getAttribute('href'), window.location.href);
    } catch (_) {
      return;
    }

    if (url.origin !== window.location.origin || url.pathname.replace(/\/+$/, '/') !== '/projects/') {
      return;
    }

    const item = anchor.closest('.menu-item');
    if (!item) return;

    const label = item.querySelector('.menu-item-name');
    if (!label || label.textContent.trim() !== 'Projects 我的项目') return;

    event.preventDefault();
    event.stopImmediatePropagation();

    const toggle = item.querySelector('.menu-dropdown-toggle');
    if (toggle) toggle.click();
  }, true);

  document.addEventListener('click', function () {
    closeAll(null);
  });

  document.addEventListener('keydown', function (event) {
    if (event.key === 'Escape') {
      closeAll(null);
    }
  });
});
</script>
