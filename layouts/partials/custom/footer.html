{{/* 站点级: 页脚底图,仿 chinaheritage.net 最下方的长方形图片 */}}
{{ if .Site.Params.enableFooterImage }}
    <div class="footer-image">
        <img src="{{ .Site.Params.footerImage | relURL }}" alt="">
    </div>
{{ end }}

<script>
document.addEventListener('DOMContentLoaded', function () {
  const dropdown = document.querySelector('.menu-item-dropdown');
  if (!dropdown) return;

  const toggle = dropdown.querySelector('.menu-dropdown-toggle');
  const submenu = dropdown.querySelector('.submenu');
  if (!toggle || !submenu) return;

  function setOpen(open) {
    dropdown.classList.toggle('is-open', open);
    toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
  }

  toggle.addEventListener('click', function (event) {
    event.stopPropagation();
    setOpen(!dropdown.classList.contains('is-open'));
  });

  submenu.addEventListener('click', function (event) {
    event.stopPropagation();
  });

  document.addEventListener('click', function () {
    setOpen(false);
  });

  document.addEventListener('keydown', function (event) {
    if (event.key === 'Escape') {
      setOpen(false);
      toggle.focus();
    }
  });
});
</script>
