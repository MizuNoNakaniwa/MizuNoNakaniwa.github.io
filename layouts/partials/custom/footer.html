{{/* 站点级: 页脚底图,仿 chinaheritage.net 最下方的长方形图片 */}}
{{ if .Site.Params.enableFooterImage }}
    <div class="footer-image">
        <img src="{{ .Site.Params.footerImage | relURL }}" alt="">
    </div>
{{ end }}

<style>
.header,
.header-wrapper,
.header-inner,
.header .nav,
.header .nav .menu,
.menu-item-dropdown {
  overflow: visible !important;
}

.menu-item-dropdown .submenu {
  display: none !important;
  height: auto !important;
  max-height: none !important;
  overflow: visible !important;
  z-index: 9999 !important;
}

.menu-item-dropdown.is-open .submenu {
  display: block !important;
}
</style>

<script>
document.addEventListener('DOMContentLoaded', function () {
  const dropdowns = document.querySelectorAll('.menu-item-dropdown');
  if (!dropdowns.length) return;

  dropdowns.forEach(function (dropdown) {
    const toggle = dropdown.querySelector('.menu-dropdown-toggle');
    const submenu = dropdown.querySelector('.submenu');
    if (!toggle || !submenu) return;

    function setOpen(open) {
      dropdown.classList.toggle('is-open', open);
      toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
    }

    toggle.addEventListener('click', function (event) {
      event.stopPropagation();
      dropdowns.forEach(function (other) {
        if (other !== dropdown) {
          other.classList.remove('is-open');
          const otherToggle = other.querySelector('.menu-dropdown-toggle');
          if (otherToggle) otherToggle.setAttribute('aria-expanded', 'false');
        }
      });
      setOpen(!dropdown.classList.contains('is-open'));
    });

    submenu.addEventListener('click', function (event) {
      event.stopPropagation();
    });
  });

  document.addEventListener('click', function () {
    dropdowns.forEach(function (dropdown) {
      dropdown.classList.remove('is-open');
      const toggle = dropdown.querySelector('.menu-dropdown-toggle');
      if (toggle) toggle.setAttribute('aria-expanded', 'false');
    });
  });

  document.addEventListener('keydown', function (event) {
    if (event.key === 'Escape') {
      dropdowns.forEach(function (dropdown) {
        dropdown.classList.remove('is-open');
        const toggle = dropdown.querySelector('.menu-dropdown-toggle');
        if (toggle) toggle.setAttribute('aria-expanded', 'false');
      });
    }
  });
});
</script>
