<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024" viewBox="0 0 1536 1024">
  <rect width="1536" height="1024" fill="#ffffff"/>
  <defs>
    <style>
      .title{font-family:"Microsoft YaHei","Noto Sans SC",sans-serif;font-weight:800;fill:#111}
      .body{font-family:"Microsoft YaHei","Noto Sans SC",sans-serif;fill:#111}
      .box{fill:#fff;stroke:#111;stroke-width:2.5;rx:8}
      .arrow{stroke:#111;stroke-width:4;fill:none;marker-end:url(#m)}
      .dash{stroke:#222;stroke-width:2.2;stroke-dasharray:8 7;fill:none;marker-end:url(#m2)}
      .small{font-size:20px}.med{font-size:23px}.head{font-size:25px;font-weight:700}
    </style>
    <marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#111"/></marker>
    <marker id="m2" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#222"/></marker>
  </defs>

  <text x="768" y="68" text-anchor="middle" class="title" font-size="52">高端定制信息流 AI｜概念草图</text>
  <text x="768" y="112" text-anchor="middle" class="body" font-size="26">目标：拒绝大多数内容，只保留高价值、有限、可控的信息流</text>

  <!-- top row -->
  <rect x="145" y="150" width="370" height="170" class="box" fill="#fff7f7"/>
  <rect x="145" y="150" width="370" height="62" fill="#fdecec" rx="8"/>
  <text x="185" y="191" class="title head">⚠ 现实问题</text>
  <text x="180" y="240" class="body med">- 无限信息流</text>
  <text x="180" y="277" class="body med">- 短视频停不下来</text>
  <text x="180" y="314" class="body med">- AI 让垃圾内容爆炸式增加</text>

  <rect x="585" y="150" width="370" height="170" class="box" fill="#fffdf5"/>
  <rect x="585" y="150" width="370" height="62" fill="#fbf3d8" rx="8"/>
  <text x="625" y="191" class="title head">🧠 核心判断</text>
  <text x="630" y="252" class="body med">问题不是信息太少，</text>
  <text x="630" y="289" class="body med">而是筛选权不在我手里</text>

  <rect x="1010" y="150" width="380" height="170" class="box" fill="#f7fff7"/>
  <rect x="1010" y="150" width="380" height="62" fill="#eaf7e9" rx="8"/>
  <text x="1050" y="191" class="title head">🎯 目标</text>
  <text x="1050" y="252" class="body med">建立一层属于我自己的过滤器</text>
  <text x="1050" y="289" class="body med">把平台算法换成我的规则</text>

  <path d="M515 235 H578" class="arrow"/><path d="M955 235 H1002" class="arrow"/>
  <path d="M770 320 V355 H1130" stroke="#111" stroke-width="4" fill="none"/>
  <path d="M770 355 H115" stroke="#111" stroke-width="4" fill="none"/>
  <path d="M115 355 V388" class="arrow"/><path d="M1425 355 V388" class="arrow"/>

  <!-- pipeline -->
  <g>
    <rect x="20" y="388" width="185" height="330" class="box" fill="#fbfdff"/>
    <rect x="20" y="388" width="185" height="88" fill="#e9f6ff" rx="8"/>
    <text x="112" y="430" text-anchor="middle" class="title head">◉</text>
    <text x="112" y="467" text-anchor="middle" class="title head">输入源</text>
    <text x="38" y="520" class="body small">抖音 / B站 /</text><text x="38" y="552" class="body small">YouTube / X /</text>
    <text x="38" y="584" class="body small">Telegram /</text><text x="38" y="616" class="body small">Newsletter</text>
    <text x="38" y="667" class="body small">抖音  B站  ▶</text><text x="38" y="699" class="body small">X  Telegram  ✉</text>

    <rect x="220" y="388" width="225" height="330" class="box" fill="#fffafa"/>
    <rect x="220" y="388" width="225" height="88" fill="#fdeeee" rx="8"/>
    <text x="332" y="430" text-anchor="middle" class="title head">◎</text>
    <text x="332" y="467" text-anchor="middle" class="title head">平台推荐层</text>
    <text x="240" y="528" class="body small">- 利用平台原生算法</text>
    <text x="240" y="564" class="body small">- 借用精准推流能力</text>
    <text x="240" y="600" class="body small">- 作为第一轮信号聚合</text>
    <text x="332" y="674" text-anchor="middle" class="body" font-size="42">▤★</text>

    <rect x="460" y="388" width="195" height="330" class="box"/>
    <rect x="460" y="388" width="195" height="88" fill="#f6f6f6" rx="8"/>
    <text x="557" y="430" text-anchor="middle" class="title head">▽</text>
    <text x="557" y="467" text-anchor="middle" class="title" font-size="21">第一层：硬过滤</text>
    <text x="480" y="528" class="body small">- 白名单来源</text><text x="480" y="564" class="body small">- 黑名单主题</text>
    <text x="480" y="600" class="body small">- 时长限制</text><text x="480" y="636" class="body small">- 频率限制</text>
    <text x="557" y="690" text-anchor="middle" class="body" font-size="35">☑ ─</text>

    <rect x="670" y="388" width="205" height="330" class="box"/>
    <rect x="670" y="388" width="205" height="88" fill="#fff8df" rx="8"/>
    <text x="772" y="430" text-anchor="middle" class="title head">♟♟</text>
    <text x="772" y="467" text-anchor="middle" class="title" font-size="21">第二层：人工策展</text>
    <text x="690" y="528" class="body small">- 可信账号</text><text x="690" y="564" class="body small">- 专家 / 策展人</text>
    <text x="690" y="600" class="body small">- 朋友推荐</text><text x="690" y="636" class="body small">- 长期验证来源</text>
    <text x="772" y="690" text-anchor="middle" class="body" font-size="40">♙♙</text>

    <rect x="890" y="388" width="190" height="330" class="box"/>
    <rect x="890" y="388" width="190" height="88" fill="#f4efff" rx="8"/>
    <text x="985" y="430" text-anchor="middle" class="title head">AI</text>
    <text x="985" y="467" text-anchor="middle" class="title" font-size="21">第三层：AI处理</text>
    <text x="912" y="528" class="body small">- 去重</text><text x="912" y="564" class="body small">- 摘要</text>
    <text x="912" y="600" class="body small">- 分类</text><text x="912" y="636" class="body small">- 提炼重点</text>
    <text x="912" y="672" class="body small">- 判断相关性</text>

    <rect x="1095" y="388" width="225" height="330" class="box"/>
    <rect x="1095" y="388" width="225" height="88" fill="#eaf7ff" rx="8"/>
    <text x="1207" y="430" text-anchor="middle" class="title head">▤</text>
    <text x="1207" y="467" text-anchor="middle" class="title" font-size="19">第四层：我的定制输出</text>
    <text x="1115" y="528" class="body small">- 每日简报</text><text x="1115" y="564" class="body small">- 主题清单</text>
    <text x="1115" y="600" class="body small">- 高价值视频/文章</text><text x="1115" y="636" class="body small">- 有限、可控的信息菜单</text>
    <text x="1207" y="690" text-anchor="middle" class="body" font-size="35">▤ ▶ ☷ ♡</text>

    <rect x="1335" y="388" width="180" height="330" class="box"/>
    <rect x="1335" y="388" width="180" height="88" fill="#effbea" rx="8"/>
    <text x="1425" y="430" text-anchor="middle" class="title head">▮▮▮</text>
    <text x="1425" y="467" text-anchor="middle" class="title head">最终效果</text>
    <text x="1355" y="528" class="body small">注意力防御系统</text><text x="1355" y="564" class="body small">不是让我看更多，</text>
    <text x="1355" y="600" class="body small">而是替我拒绝</text><text x="1355" y="636" class="body small">绝大多数内容</text>
    <text x="1425" y="690" text-anchor="middle" class="body" font-size="42">🛡</text>
  </g>

  <path d="M205 553 H215" class="arrow"/><path d="M445 553 H455" class="arrow"/><path d="M655 553 H665" class="arrow"/>
  <path d="M875 553 H885" class="arrow"/><path d="M1080 553 H1090" class="arrow"/><path d="M1320 553 H1330" class="arrow"/>

  <!-- lower -->
  <rect x="350" y="765" width="225" height="175" class="box"/>
  <rect x="350" y="765" width="225" height="54" fill="#fff1f1" rx="8"/>
  <text x="462" y="801" text-anchor="middle" class="title head">⚙ 个性化参数</text>
  <text x="375" y="840" class="body small">- 我的目标</text><text x="375" y="870" class="body small">- 我的项目</text>
  <text x="375" y="900" class="body small">- 我的审美 / 学习方向 / 禁区</text>

  <rect x="905" y="765" width="255" height="175" class="box"/>
  <rect x="905" y="765" width="255" height="54" fill="#eaf7ff" rx="8"/>
  <text x="1032" y="801" text-anchor="middle" class="title head">⟳ 反馈回路</text>
  <text x="930" y="840" class="body small">- 我收藏什么</text><text x="930" y="870" class="body small">- 我跳过什么</text>
  <text x="930" y="900" class="body small">- 我真正用上什么 / 系统持续学习</text>

  <path d="M462 765 V735 H332 V721" class="dash"/><path d="M520 765 V740 H557 V721" class="dash"/>
  <path d="M575 850 H700 V721" class="dash"/><text x="700" y="812" class="body" font-size="17">调整过滤规则 / 影响AI处理 / 定制输出形式</text>
  <path d="M905 875 H575" class="dash"/><text x="660" y="905" class="body" font-size="17">更新我的偏好，优化过滤与推荐</text>
  <path d="M1335 820 H1165" class="dash"/><text x="1280" y="793" class="body" font-size="17">反馈效果</text><text x="1280" y="818" class="body" font-size="17">不断优化</text>

  <rect x="165" y="955" width="1205" height="58" rx="14" fill="#ffe878"/>
  <text x="190" y="996" class="title" font-size="28">💡 核心逻辑：不是推荐更多内容，而是先替用户拒绝 95% 的内容。</text>
</svg>